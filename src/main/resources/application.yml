spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY}
    base-url: https://places.googleapis.com/v1
resilience4j:
  retry:
    instances:
      googlePlaces:
        max-attempts: 3
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
        ignore-exceptions:
          - com.example.travel.exception.PlaceNotFoundException
  circuitbreaker:
    instances:
      googlePlaces:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.example.travel.exception.PlaceNotFoundException
management:
  endpoints:
    web:
      exposure:
        include: health,info